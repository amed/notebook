# nginx server block for the web version (dist-web/). Replace the server
# name, certificate paths and root. CONTENT_SECURITY_POLICY below is the
# default build's policy (AWS only); if you built with
# NOTEBOOK_WEB_CONNECT_SRC, copy the policy from dist-web/index.html's <meta>
# tag (or dist-web/_headers) instead, so both policies allow your endpoint.

server {
    listen 443 ssl;
    http2 on;
    server_name notes.example.com;

    ssl_certificate     /etc/ssl/certs/notes.example.com.pem;
    ssl_certificate_key /etc/ssl/private/notes.example.com.key;

    root /var/www/notebook-web;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Headers for every response (repeated in each location that adds its own).
    set $csp_app "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.amazonaws.com; frame-src 'self'; worker-src 'none'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
    set $csp_frame "default-src 'none'; style-src 'unsafe-inline'; img-src data:; media-src data:; font-src data:; form-action 'none'; base-uri 'none'; frame-ancestors 'self'";

    location = /preview.html {
        add_header Content-Security-Policy $csp_frame always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control no-cache always;
    }

    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy $csp_app always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cache-Control no-cache always;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name notes.example.com;
    return 301 https://$host$request_uri;
}
